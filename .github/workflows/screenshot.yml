name: screenshot

# After each successful deploy, screenshot the live homepage and commit it to docs/screenshot.png
# (shown in the README). Pushes made with GITHUB_TOKEN do not trigger other workflows, so this
# cannot loop back into deploy.
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshot
  cancel-in-progress: true

jobs:
  screenshot:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Take screenshot of the homepage
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://stijnris.github.io/language-bench' }}
        run: |
          mkdir -p "$RUNNER_TEMP/shot" docs
          cd "$RUNNER_TEMP/shot"
          npm init -y >/dev/null
          npm install playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright";
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 }, deviceScaleFactor: 1 });
          await page.goto(process.env.SITE_URL + "/", { waitUntil: "networkidle" });
          await page.waitForTimeout(1000);
          await page.screenshot({ path: process.argv[2], fullPage: true });
          await browser.close();
          JS
          node shot.mjs "$GITHUB_WORKSPACE/docs/screenshot.png"
      - name: Commit screenshot
        run: |
          git config user.name "language-bench[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs/screenshot.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: update homepage screenshot"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs || true
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
