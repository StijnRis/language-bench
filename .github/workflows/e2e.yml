name: e2e

# Builds the static site and runs the Playwright smoke tests (web/e2e): every route renders without
# console errors, share cards / badges / CSV are served, URL-synced views work, theme toggle, mobile layout.
on:
  pull_request:
    paths: ["web/**", "core/**", "languages/**", "problems/**", "data/**", ".github/workflows/e2e.yml"]
  push:
    branches: [main]
    paths: ["web/**", "core/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lb/web exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          SITE_URL: http://localhost:4173
      - run: pnpm --filter @lb/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
