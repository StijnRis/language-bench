name: bench

# Self-driving benchmark loop. Every run:
#   1. looks for new language releases (updates languages/*/language.json),
#   2. asks the planner (lb.config.json) which benchmarks still need data,
#   3. runs one or more *sessions* (one VM each, many benchmarks per session),
#   4. appends the raw results to data/ and
#   5. if benchmarks are still below the target, starts itself again.
# When every tracked benchmark has enough data the run ends after step 2 (cheap), until a
# new release / configuration shows up. Everything tunable lives in lb.config.json.
on:
  schedule:
    - cron: "17 */6 * * *" # periodic check for new versions / configurations
  workflow_dispatch:
    inputs:
      round:
        description: "Round number in a chain (set automatically)"
        required: false
        default: "1"
      reps:
        description: "Override the repetition count (testing)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sessions: ${{ steps.plan.outputs.sessions }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Look for new language releases
        id: versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm -s lb discover-versions
      - name: Commit new versions
        run: |
          git config user.name "language-bench[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add languages
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: track new language releases"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Plan sessions
        id: plan
        run: pnpm -s lb plan --out plans
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.sessions != '0'
        with:
          name: plans
          path: plans/*.json
          retention-days: 7

  session:
    needs: plan
    if: ${{ needs.plan.outputs.sessions != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: session ${{ matrix.session }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: plans
          path: plans
      - name: Run the session (many benchmarks on this VM)
        run: |
          reps=""
          if [ -n "${{ inputs.reps }}" ]; then reps="--reps ${{ inputs.reps }}"; fi
          pnpm -s lb session --plan "$GITHUB_WORKSPACE/plans/session-${{ matrix.session }}.json" --out "$GITHUB_WORKSPACE/fragments/session-${{ matrix.session }}.json" $reps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fragment-${{ matrix.session }}
          path: fragments/*.json
          if-no-files-found: ignore
          retention-days: 7

  merge:
    needs: [plan, session]
    if: ${{ !cancelled() && needs.plan.outputs.sessions != '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: fragment-*
          path: fragments
          merge-multiple: true
      - name: Append sessions to data/ (append-only)
        run: |
          pnpm -s lb merge fragments
          pnpm -s lb validate
      - name: Commit and push
        run: |
          git config user.name "language-bench[bot]"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: sessions from run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs || true
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
      - name: Continue while benchmarks are below the target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(pnpm -s lb status)
          echo "$status"
          remaining=$(echo "$status" | jq .remaining)
          round=${{ inputs.round || 1 }}
          max=$(jq .maxChainedRounds lb.config.json)
          # publish the new data (workflow_run chains are depth-limited, so dispatch explicitly)
          gh workflow run deploy.yml
          if [ "$remaining" -gt 0 ] && [ "$round" -lt "$max" ]; then
            echo "starting round $((round + 1))"
            gh workflow run bench.yml -f round=$((round + 1))
          else
            echo "chain ends (remaining=$remaining, round=$round/$max)"
          fi
