name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["methodology/**.md", "docs/screenshot.png"]
  # pushes made with GITHUB_TOKEN do not trigger workflows, so redeploy when a bench run finishes
  workflow_run:
    workflows: [bench]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://stijnris.github.io/language-bench' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/language-bench' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
